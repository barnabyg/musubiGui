name: Verify
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.11.7'
      - run: uv sync --locked
      - run: npm.cmd ci
      - run: npm.cmd run verify
