name: Verify
on:
  # Pull requests cover branches; a branch without one can run this by hand.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    # Upper bound with deliberate margin; see docs/verification.md.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.11.7'
          enable-cache: true
      - run: uv sync --locked
      - run: npm.cmd ci
      - run: npm.cmd run verify
      # Keep Playwright's page snapshots and screenshots so intermittent failures can be diagnosed.
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 14
