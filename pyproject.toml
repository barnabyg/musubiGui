[project]
name = "musubi-gui"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "av==17.1.0",
    "fastapi==0.162.0",
    "pillow==13.0.0",
    "psutil==7.2.2",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "build==1.6.1",
    "detect-secrets==1.5.0",
    "hatchling==1.32.4",
    "httpx2==2.16.0",
    "mypy==2.4.0",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "ruff==0.17.2",
    "types-psutil==7.2.2.20260906",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["musubi_gui"]

[tool.hatch.build]
artifacts = ["musubi_gui/web/**"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".cache", ".worktrees", "musubi_gui/web"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["musubi_gui", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
filterwarnings = ["error"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".cache", ".worktrees"]
